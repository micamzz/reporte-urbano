<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparencia - Reporte Urbano</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body class="cuerpoPagina">
  <div id="contenedorHeader"></div>
  <main class="dashboardContenedor">
    <h1 class="dashboardContenedor-h1">Transparencia Pública</h1>
    <p class="dashboardContenedor-p">Datos abiertos sobre la gestión de incidencias en el municipio.</p>
    <div class="kpiGrilla">
      <div class="kpiGrilla-kpiTarjeta">
        <div class="kpiTarjeta-kpiValor" id="kpiTotal">0</div>
        <div class="kpiTarjeta-kpiEtiqueta">Reportes Totales</div>
      </div>
      <div class="kpiGrilla-kpiTarjeta">
        <div class="kpiTarjeta-kpiValor" id="kpiResueltos">0</div>
        <div class="kpiTarjeta-kpiEtiqueta">Resueltos</div>
      </div>
      <div class="kpiGrilla-kpiTarjeta">
        <div class="kpiTarjeta-kpiValor" id="kpiProceso">0</div>
        <div class="kpiTarjeta-kpiEtiqueta">En Proceso</div>
      </div>
    </div>

    <div class="graficosGrilla">
      <div class="graficosGrilla-graficoTarjeta">
        <h3 class="graficoTarjeta-h3">Incidencias por Categoría</h3>
        <!-- Contenedor con altura fija para frenar a Chart.js -->
        <div class="graficoTarjeta-chart">
          <canvas id="graficoCategorias"></canvas>
        </div>
      </div>

      <div class="graficosGrilla-graficoTarjeta">
        <h3 class="graficoTarjeta-h3">Estado General</h3>
        <!-- Contenedor con altura fija para frenar a Chart.js -->
        <div class="graficoTarjeta-chart">
          <canvas id="graficoEstados"></canvas>
        </div>
      </div>
    </div>

  </main>
  <div id="contenedorFooter"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script type="module" src="../assets/js/dashboard.js"></script>
</body>

</html>
