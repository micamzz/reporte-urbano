<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creá una cuenta de Reporte Urbano.">
  <title>Crear cuenta - Reporte Urbano</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="../assets/css/styles.css">
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
  <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body class="cuerpoPagina">
  <div id="contenedorHeader"></div>

  <main class="seccionAcceso">
    <section class="tarjetaAcceso" aria-labelledby="tituloRegistro">
      <div class="encabezadoAcceso">
        <h1 id="tituloRegistro">Crear una cuenta</h1>
        <p>Registrate para seguir tus reportes y participar en tu barrio.</p>
      </div>

      <form id="formularioRegistro" class="formularioAcceso" novalidate>
        <div class="campoAcceso">
          <label for="nombreRegistro">Nombre</label>
          <input id="nombreRegistro" name="nombre" type="text" autocomplete="name" placeholder="Tu nombre" aria-describedby="errorNombre" required>
          <span class="errorCampo" id="errorNombre" aria-live="polite"></span>
        </div>

        <div class="campoAcceso">
          <label for="emailRegistro">Correo electrónico</label>
          <input id="emailRegistro" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" aria-describedby="errorEmail" required>
          <span class="errorCampo" id="errorEmail" aria-live="polite"></span>
        </div>

        <div class="campoAcceso">
          <label for="passwordRegistro">Contraseña</label>
          <input id="passwordRegistro" name="password" type="password" autocomplete="new-password" placeholder="Al menos 8 caracteres" minlength="8" aria-describedby="ayudaPassword errorPassword" required>
          <small id="ayudaPassword">Al menos 8 caracteres, una mayúscula y un símbolo: ! @ # $ % &amp; * ? . _ + - =</small>
          <span class="errorCampo" id="errorPassword" aria-live="polite"></span>
        </div>

        <button class="botonAcceso" type="submit">Crear cuenta</button>
        <p class="mensajeAcceso" id="mensajeRegistro" role="status" aria-live="polite"></p>
        <p class="leyendaRegistro">¿Ya tenés una cuenta? <a href="/pages/login.html">Ingresá</a></p>
      </form>
    </section>
  </main>

  <dialog id="popupRegistroExitoso" class="popupRegistro" aria-labelledby="tituloRegistroExitoso" aria-describedby="descripcionRegistroExitoso">
    <h2 id="tituloRegistroExitoso">Cuenta registrada exitosamente</h2>
    <p id="descripcionRegistroExitoso">Ya podés iniciar sesión con tu correo y contraseña.</p>
    <a class="botonAcceso" href="/pages/login.html" autofocus>Ir al login</a>
  </dialog>

  <div id="contenedorFooter"></div>
  <script type="module" src="../assets/js/registro.js"></script>
</body>
</html>
